version: 2

models:
  - name: dim_accounts
    description: "Account dimension. One row per company, with a surrogate key and a parent-company flag."
    columns:
      - name: account_id
        description: "Surrogate key (ROW_NUMBER ordered by account name). Rebuilt on every run."
        data_tests: [unique, not_null]
      - name: account_name
        description: "Company name."
        data_tests: [unique, not_null]
      - name: sector
        description: "Industry sector."
      - name: year_established
        description: "Year in which the company was established."
      - name: revenue
        description: "Company revenue."
      - name: employees
        description: "Number of employees."
      - name: office_location
        description: "Country of the company's office."
      - name: subsidiary_of
        description: "Name of the parent company. NULL when the account has no parent."
      - name: is_parent
        description: "1 if at least one other account is a subsidiary of this company, otherwise 0."
        data_tests:
          - accepted_values:
              values: [0, 1]

  - name: dim_products
    description: "Product dimension. One row per product."
    columns:
      - name: product_id
        description: "Surrogate key (ROW_NUMBER ordered by product name). Rebuilt on every run."
        data_tests: [unique, not_null]
      - name: product_name
        description: "Product name."
        data_tests: [unique, not_null]
      - name: product_series
        description: "Product series or family."
      - name: sales_price
        description: "List sales price of the product."

  - name: dim_sales_team
    description: "Sales agent dimension. One row per sales agent with manager and regional office."
    columns:
      - name: agent_id
        description: "Surrogate key (ROW_NUMBER ordered by agent name). Rebuilt on every run."
        data_tests: [unique, not_null]
      - name: agent_name
        description: "Sales agent name."
        data_tests: [unique, not_null]
      - name: manager_name
        description: "Name of the agent's manager."
      - name: regional_office
        description: "Regional office of the agent."

  - name: dim_dates
    description: "Date dimension built from the distinct engage and close dates in the pipeline. Used as a role-playing dimension for engage and close dates."
    columns:
      - name: date_key
        description: "Integer key in YYYYMMDD format."
        data_tests: [unique, not_null]
      - name: date
        description: "Calendar date."
        data_tests: [unique, not_null]
      - name: year
        description: "Calendar year."
      - name: month
        description: "Month number (1-12)."
      - name: day
        description: "Day of the month."
      - name: month_name
        description: "Month name."
      - name: day_name
        description: "Day of the week name."

  - name: fct_sales_opportunity
    description: "Fact table. Grain: one row per sales opportunity."
    columns:
      - name: opportunity_id
        description: "Primary key. Unique identifier of the sales opportunity."
        data_tests: [unique, not_null]
      - name: account_id
        description: "Foreign key to dim_accounts."
        data_tests:
          - relationships:
              to: ref('dim_accounts')
              field: account_id
      - name: product_id
        description: "Foreign key to dim_products."
        data_tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: agent_id
        description: "Foreign key to dim_sales_team."
        data_tests:
          - relationships:
              to: ref('dim_sales_team')
              field: agent_id
      - name: engage_date_key
        description: "Foreign key to dim_dates for the engage date."
        data_tests:
          - relationships:
              to: ref('dim_dates')
              field: date_key
      - name: close_date_key
        description: "Foreign key to dim_dates for the close date. NULL for open opportunities."
        data_tests:
          - relationships:
              to: ref('dim_dates')
              field: date_key
      - name: deal_stage
        description: "Stage or outcome of the opportunity (Prospecting, Engaging, Won, Lost)."
        data_tests:
          - accepted_values:
              values: ['Prospecting', 'Engaging', 'Won', 'Lost']
      - name: close_value
        description: "Value of the deal at closing."